<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-shell">
        <div class="board-panel">
            <div id="chessboard" aria-label="Chess board"></div>
        </div>

        <aside class="info-panel">
            <div id="statusBar" class="status-bar">White to move</div>

            <div class="info-card">
                <h3>Captured</h3>
                <div id="capturedPieces" class="captured-pieces"></div>
            </div>

            <div class="info-card">
                <h3>Move Log</h3>
                <ol id="moveLog" class="move-log"></ol>
            </div>

            <div class="controls">
                <button id="resetButton">Reset Board</button>
                <button id="undoButton" disabled>Undo Move</button>
                <button id="redoButton" disabled>Redo Move</button>
            </div>
        </aside>
    </div>

    <div id="gameOverModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
        <div class="modal-content">
            <h2 id="gameOverTitle">Game Over</h2>
            <p id="gameOverMessage">Checkmate</p>
            <button id="newGameButton">Play Again</button>
        </div>
    </div>

    <script src="piece_moveset.js"></script>
    <script src="script.js"></script>
</body>
</html>
